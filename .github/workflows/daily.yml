name: Daily sports poster

on:
  schedule:
    # 02:00 Kyiv in summer (UTC+3)
    - cron: "0 23 * * *"
    # 02:00 Kyiv in winter (UTC+2)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Publish daily sports poster
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
          SCHEDULE_CRON: ${{ github.event.schedule || '' }}
        run: python main.py
